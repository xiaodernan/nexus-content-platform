# Central truth for `spring.application.name=nexus-api` when NEXUS_CONFIG_ENABLED=true.
#
# The packaged file keeps registration OFF, because a standalone run (a proof, a test, `java -jar` on a
# laptop) must not depend on something answering on 8761. This file is the other half of that sentence:
# THIS lab has a registry, so an instance started against the config center registers itself and the
# gateway's `lb://nexus-api` route can resolve it without a start-up script remembering an env variable.
#
# Evidence this value came from here: with the client enabled and no NEXUS_API_REGISTER in the environment,
# the instance appears in the registry — the local default is false, so nothing else could have said true.
eureka:
  client:
    register-with-eureka: true
