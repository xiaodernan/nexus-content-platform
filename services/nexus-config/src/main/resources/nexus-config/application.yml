# Served as `GET /application/default` and merged under every application-specific file.
#
# Only settings that are identical for every client belong here. A value that differs per service goes in
# that service's own file, so a reader can answer "where does this come from?" with one path.
#
# Discovery: this lab starts against a Eureka registry, so every client registers by default here. Each
# packaged `application.yml` keeps `enabled: false` so a standalone run stays offline-truth; the config
# door here is the lab's shared truth that supersedes those packaged defaults.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Shared discovery enablement for the lab's services. A client's app.yml still wins when it explicitly
# names one of these keys; the config door only supplies the defaults the lab proves otherwise.
eureka:
  client:
    enabled: true
    register-with-eureka: true
