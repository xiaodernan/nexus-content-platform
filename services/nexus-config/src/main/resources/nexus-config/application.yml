# Served as `GET /application/default` and merged under every application-specific file.
#
# Only settings that are identical for every client belong here. A value that differs per service goes in
# that service's own file, so a reader can answer "where does this come from?" with one path.
#
# Exposure stays narrow (health,info) — no payload, no internal counters. A service that needs
# more (e.g. circuitbreakers) extends it in its own file below, never here, so the shared
# default never leaks one client's observability into every client.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
