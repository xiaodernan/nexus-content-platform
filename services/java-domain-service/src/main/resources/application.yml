# NEXUS nexus-domain-service — the AUTHORITATIVE WRITE PATH for the domain tables.
#
# Every value here is overridable by environment. The service writes to the SAME `projects` and
# `users` tables the web layer reads (see `apps/web/src/server/db/schema.ts`), so the datasource
# must be pointed at the right database rather than at whatever is on 5432 — which on this machine
# is somebody else's container.
server:
  port: ${NEXUS_DOMAIN_PORT:8081}

# The port this service actually bound to, written to this file once the server is up. Unset means the
# component does nothing; a proof sets it so it can address the service without parsing a log line.
nexus:
  port-file: ${NEXUS_DOMAIN_PORT_FILE:}

spring:
  application:
    name: nexus-domain-service
  # The config door, optional (see nexus-api): a deployment without
  # the config server boots with this file as it stands.
  config:
    # NEXUS's OWN port, not Spring's default 8888: 8888 is the first port a neighbouring Spring
    # project takes, and measured 2026-11-10 one did — its config door answered ours and handed a
    # proof service a FOREIGN `eureka.client.service-url` (ADR 0057 amendment 658). Compose publishes
    # this door on 18888 and the smoke probes 18888; the default now agrees with both.
    import: "optional:configserver:${NEXUS_CONFIG_SERVER_URL:http://127.0.0.1:18888}"
  datasource:
    url: ${NEXUS_DB_URL:jdbc:postgresql://127.0.0.1:5432/nexus}
    username: ${NEXUS_DB_USER:nexus}
    password: ${NEXUS_DB_PASSWORD:nexus}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # `validate`, NOT `update`. The schema of these tables is owned by drizzle in the web layer;
      # a second writer that is allowed to ALTER the schema would silently diverge from the owner.
      # `validate` means this service REFUSES TO START if its entity mapping does not match the
      # table that is actually there — which is the honest way for a write path to disagree with
      # the schema owner.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  # Redis and Flyway were REMOVED from this file. There is no RedisTemplate in the source, and
  # there is no db/migration directory: the schema is owned by drizzle, and a second migration
  # tool pointed at the same database writes its own history table into a database it does not own.

logging:
  # v656 — the ids have to BE in the line for anyone (including a proof) to read them. Boot only
  # prints them when this pattern is set; measured: without it the format is `[app]` and with it
  # `[app,traceId,spanId]` (empty ids on a thread with no span, which is the honest rendering too).
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.nexus: INFO
    org.springframework.web: WARN

# The operator's door — identical with or without the config server (§4 of ADR 0056/0058 keeps
# the four-service surface uniform): health/info/metrics/prometheus on the service's OWN port.
management:
  # v656 — ONE trace id, and it travels on the WIRE (W3C `traceparent`), not in a header NEXUS invented.
  # Sampling is 1.0 in development because a sampled-out request is a request with nothing to read; a
  # deployment sets NEXUS_TRACING_SAMPLING (0.1 is a normal production number).
  tracing:
    sampling:
      probability: ${NEXUS_TRACING_SAMPLING:1.0}
    propagation:
      type: W3C
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Discovery, OPT-IN. With NEXUS_EUREKA_ENABLED=true this service registers with the registry under the
# name `nexus-domain-service`, which is the name `nexus-api`'s OpenFeign client asks for; with it unset
# the service behaves exactly as it did before and does not need a registry to start. The client is on
# the classpath either way — the switch decides whether it DIALS anything.
#
# Eureka's own namespace is TOP-LEVEL `eureka.*`, not `spring.cloud.eureka.*`. Measured in this repo:
# written under the wrong prefix the client started anyway and dialled a registry nobody started, for a
# reason no log line explained.
eureka:
  client:
    enabled: ${NEXUS_EUREKA_ENABLED:false}
    register-with-eureka: ${NEXUS_EUREKA_ENABLED:false}
    fetch-registry: ${NEXUS_EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${NEXUS_EUREKA_URL:http://127.0.0.1:8761/eureka/}
  instance:
    prefer-ip-address: true
