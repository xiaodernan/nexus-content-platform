# NEXUS java-domain-service — the Java write-path service (SC-6).
#
# Every value is overridable by environment for the same reason nexus-api's are: a proof must be able to
# point this service at ITS OWN port and database. The defaults below are local-development conveniences,
# not a deployment contract.
server:
  port: ${NEXUS_DOMAIN_PORT:8082}

spring:
  application:
    name: nexus-domain-service
  # SC-11 — config client, same contract as the gateway (SC-9): `optional:` import, client OFF by default.
  config:
    import: optional:configserver:${NEXUS_CONFIG_URL:http://127.0.0.1:8888}
  cloud:
    config:
      enabled: ${NEXUS_CONFIG_ENABLED:false}
  autoconfigure:
    # Without this, Boot prints "Using generated security password" and configures an in-memory user that no
    # request needs: SecurityConfig defines the only filter chain this service has.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # The schema is owned by the WEB layer (apps/web/src/server/db/schema.ts + its Drizzle migrations).
    # This service reads and writes the tables that already exist; it never runs DDL (ddl-auto: none) and
    # carries no migration tool, because a second writer of DDL is how two systems disagree about a table.
    # Default targets THIS project's Postgres (55433, docs/ENVIRONMENT.md). The previous default
    # (5432) is this machine's careeros-postgres — connecting to somebody else's database by accident
    # is not a convenience default, it is a trap; and on a machine where 5432 is simply not ours, the
    # service could not boot at all. A stand-alone `java -jar` must reach the project's own database.
    url: ${NEXUS_DOMAIN_DB_URL:jdbc:postgresql://127.0.0.1:55433/nexus}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus_dev_only}
    driver-class-name: org.postgresql.Driver
    hikari:
      # `stringtype=unspecified` lets PostgreSQL infer the type of a bound String instead of assuming
      # varchar. The shared schema uses native ENUM columns (`project_kind`, `visibility`, `user_role`), and
      # without this an INSERT of "website" fails with "column kind is of type project_kind but expression is
      # of type character varying". It is set on the pool, not the URL, so it also applies when a deployment
      # supplies NEXUS_DOMAIN_DB_URL without remembering to add the parameter.
      data-source-properties:
        stringtype: unspecified
  jpa:
    hibernate:
      # `none`: the shared schema is not this service's to change. See the datasource comment above.
      ddl-auto: ${NEXUS_DOMAIN_DDL_AUTO:none}
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # 56379 is this project's nexus-redis (docs/ENVIRONMENT.md). 6379 on this machine belongs to another
      # project's Redis and requires AUTH — defaulting to it made a fresh `java -jar` report health DOWN and
      # then need an environment variable to recover. A default that points at someone else's service is not
      # a default, it is a trap.
      port: ${REDIS_PORT:56379}

# SC-6 — the discovery half of the gateway's second `lb://` route.
#
# Registration and fetch are both OFF by default, exactly like nexus-api: a standalone run (a test, a proof,
# `java -jar` on a laptop) must not depend on something answering on 8771 (the dedicated registry port;
# 8761 is the framework default and, on this machine, provably already somebody else's — see docs/adr/0100).
# A deployment that wants discovery
# sets NEXUS_DOMAIN_REGISTER=true.
eureka:
  client:
    service-url:
      defaultZone: ${NEXUS_REGISTRY_ZONE:http://127.0.0.1:8771/eureka/}
    register-with-eureka: ${NEXUS_DOMAIN_REGISTER:false}
    fetch-registry: ${NEXUS_DOMAIN_FETCH:false}
  instance:
    prefer-ip-address: true

# SC-8 — see nexus-api: only `health` is exposed, and details stay out of an unauthenticated answer.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.nexus: INFO
    org.springframework.web: WARN

info:
  app:
    name: java-domain-service
    description: NEXUS Java-side service (java-domain-service)
