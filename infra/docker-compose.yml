name: nexus

# 本机同时跑着其它项目的容器，所以这里全部用 nexus- 前缀 + 独立端口段，
# 且按 profile 分开启动：内存有限（见 docs/ENVIRONMENT.md），不要一次拉起全套。
#   npm run infra:up        → 只起 postgres（M0/M1 足够）
#   npm run infra:up:full   → postgres + redis + minio

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    profiles: ['core', 'full']
    restart: unless-stopped
    # 55433 是文档里的开发端口；55100 是集成测试用的别名（同一实例、不同库，
    # 例如 nexus_regress）。两个端口都留着，免得并行会话各自改映射把对方弄断。
    ports: ['55433:5432', '55100:5432']
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_only
      POSTGRES_DB: nexus
    volumes:
      - nexus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    profiles: ['full']
    restart: unless-stopped
    ports: ['56379:6379']
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: nexus-minio
    profiles: ['full']
    restart: unless-stopped
    ports: ['59000:9000', '59001:9001']
    environment:
      MINIO_ROOT_USER: nexus_dev_only
      MINIO_ROOT_PASSWORD: nexus_dev_only_secret
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - nexus-storage:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nexus-pgdata:
    name: nexus-pgdata
  nexus-storage:
    name: nexus-storage
