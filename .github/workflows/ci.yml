name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    # The proofs step has per-row budgets, but nothing ABOVE it does: `npm ci`, typecheck, lint, test, build
    # and `docker pull` are bounded only by the platform's default. 60 minutes is generous against measured
    # runs (98 rows in 7 m 27 s of proofs-step wall time, run 40723067246) and far below the rows' own worst
    # case (92 default rows × 240 s plus the six declared ones ≈ 7.1 h), so this is the TIGHTER ceiling rather
    # than a second copy of theirs.
    timeout-minutes: 60
    # Checkout, test, build, run proofs — nothing in this workflow writes back, so the token is narrowed to
    # what actions/checkout needs instead of carrying the repository default.
    permissions:
      contents: read
    services:
      # `mvn package` on the four service modules includes the TEST phase — java-domain-service's
      # AiHealthBreakerOpenTest boots the Spring context, and the context needs a reachable database
      # to determine the Hibernate dialect (no SELECT 1 needed, but the connection must exist).
      # Without this the warm-up red on a fresh runner with Unable to determine Dialect.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_dev_only
          POSTGRES_DB: nexus
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The evidence proofs audit this repository's HISTORY (`git log -S` in hunk-shape §3), and a
          # depth-1 clone holds one commit: measured on ubuntu, the history claim answered `[]` and the
          # row went red — the proof was right and the clone could not answer. History is a declared
          # input of the proofs step, so it is fetched.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # The evidence proofs strip TypeScript out of the modules they grade through `node:module`'s
          # type-stripper, so the runner that grades them must be a Node that carries it — and the box that
          # WRITES these proofs runs Node 24. A build on a Node the proofs cannot run on is a red nobody
          # can read, and `engines` says only ">=20", which cannot decide this.
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          # The m7 rows build services/nexus-api with Maven, and publish-proof asserts `java -version`
          # matches /version "25/ while the image's DEFAULT JDK is 17. The toolchain is PINNED here the way
          # Node is: ambient JDK selection is exactly the environment a proof must not be at the mercy of,
          # and a pinned action survives the image moving under us. `cache: maven` warms the local
          # repository the first building row pays for, so later runs restore it instead of downloading it.
          distribution: temurin
          java-version: '25'
          cache: maven
          # The key hashed ONE pom while the tree tracks five, so a change to the registry, the gateway, the
          # domain service, the config server or the api re-used the previous job's cache — and the first build
          # of the CHANGED module paid for its own parents and plugins inside the row that grades it.
          # §15 refuses a tracked pom missing here.
          cache-dependency-path: |
            services/java-registry/pom.xml
            services/java-gateway/pom.xml
            services/java-domain-service/pom.xml
            services/nexus-api/pom.xml
            services/java-config-server/pom.xml
            services/nexus-registry/pom.xml
            services/nexus-config/pom.xml
            services/nexus-gateway/pom.xml
      - name: Install (workspace root)
        run: npm ci || npm install
      - name: ADR index integrity
        run: |
          shopt -s nullglob
          for f in docs/decisions/[0-9]*.md; do
            id=$(basename "$f" | grep -oE '^[0-9]+')
            grep -q "$id" docs/decisions/README.md || { echo "ADR $id not indexed"; exit 1; }
          done
          echo "All ADR files are indexed."
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # `npm run lint` above is `turbo run lint`, and a package joins that run only by declaring a `lint`
      # script — the step below prints the tally it resolves from the root workspaces globs, so nobody has
      # to trust a comment about how many that is. This step is the surface the rest of the tree never had:
      # every tracked source file outside the packages that lint themselves, one ESLint child per area,
      # judged against a debt ledger that only falls (docs/evidence/ci/lint-debt.json).
      # It runs in CI on purpose: a lint surface nobody reaches is a lint surface nobody sees rot.
      # The script is named `verify:*` so the evidence census has to decide it: MANIFEST disposes it as the
      # second door the build walks directly, and `tools/ci/lint-tree.mjs` lands in that census as a runner
      # instead of an unaccounted module under tools/.
      - name: Lint the whole tree against the debt ledger
        run: npm run verify:lint-tree
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Warm the Maven repository (every tracked module, the lifecycle the rows run)
        # v547 (ADR 0016 amendment 530) made this step ONLINE on purpose: the service-suite row runs `mvn -o` —
        # OFFLINE, because a test that needs the network is not a test of this tree — and offline is only honest
        # against a warm local repository, since `cache: maven` restores only what a PREVIOUS job saved. What it
        # warmed was ONE module. The tree tracks four poms and the other three (java-registry, java-gateway,
        # java-domain-service — the Spring Cloud topology) were named by no step of either workflow file, so
        # their parents, plugins and BOMs were never in the cache the row reads. That silence is the second half
        # of why `verify:spring-cloud` sits EXCLUDED: "an offline-warm Maven for the three service modules the
        # workflow never builds". This step is what retiring that entry needs on the Maven side.
        # FOUR EXPLICIT LINES, not a glob and not a reactor: §15 of the ci-wiring gate counts a module as reached
        # only when a run command NAMES its pom, and `mvn -f services/*/pom.xml` is a shape a reader cannot
        # attribute to a module — a command the census cannot attribute is a command the census cannot redden.
        # The lifecycle is `package`, not `test`: package runs the test phase AND resolves the jar-shaped
        # dependencies the java proof's offline `mvn -o -B package -DskipTests` needs, so the warm-up runs the
        # lifecycle the rows actually ask for instead of a narrower one. It grades nothing itself.
        run: |
          mvn -B -q -f services/java-registry/pom.xml package
          mvn -B -q -f services/java-gateway/pom.xml package
          mvn -B -q -f services/java-domain-service/pom.xml package
          mvn -B -q -f services/nexus-api/pom.xml package
      - name: Docker images (pre-pull for the lane proofs)
        # exec-host spawns containers with `--pull never` (its lanes must not depend on a registry at
        # run time), so the image the Studio lane proofs use has to exist BEFORE the proofs start. On a
        # fresh runner it does not, and the red would name the image cache rather than the lane.
        # The second pull is the leak-sweep row's whole admission: its §5 stages a real orphan from this
        # image and sweeps it, so the exclusion it used to carry ("a docker daemon that can pull and run
        # pgvector/pgvector:pg16") is satisfied HERE, before the row is timed — a pull inside the row
        # would spend the row's budget on the registry.
        run: |
          docker pull node:22-alpine
          docker pull pgvector/pgvector:pg16
      - name: Evidence proofs
        run: npm run verify:proofs
